name: nutriscan_app
description: "NutriScan - AI-Powered Personalized Food Safety & Ingredient Analysis System"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Network
  dio: ^5.5.0

  # Typography
  google_fonts: ^6.2.1

  # Animation
  flutter_animate: ^4.5.0
  lottie: ^3.1.2

  # Images
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  camera: ^0.11.0+2

  # Local storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  web: ^1.1.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  # Custom fonts are loaded via google_fonts at runtime (no bundled .ttf here);
  # assets/fonts/ is kept for any future offline font bundling.
